name: Metrics

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Patch upstream API compatibility and token-access issues.
      - uses: actions/checkout@v4
        with:
          repository: lowlighter/metrics
          ref: 65836723097537a54cd8eb90f61839426b4266b6
          path: .metrics-action
          persist-credentials: false

      - name: Apply Metrics compatibility fixes
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path('.metrics-action')
          p = root / 'source/plugins/habits/index.mjs'
          s = p.read_text().replace('payload.commits)', '(payload.commits ?? []))')
          p.write_text(s)
          # GitHub retired Projects classic. Omit its unavailable Manager badge.
          p = root / 'source/plugins/achievements/queries/achievements.graphql'
          s, n = re.subn(r'    projects\(.*?\n    }\n', '', p.read_text(), flags=re.S)
          assert n == 1
          p.write_text(s)
          p = root / 'source/plugins/achievements/list/users.mjs'
          s, n = re.subn(r'  //Manager\n.*?(?=  //Reviewer)', '', p.read_text(), flags=re.S)
          assert n == 1
          p.write_text(s)
          # Repository integration tokens cannot query user gists.
          # Omit only the Gister badge instead of failing all achievements.
          p = root / 'source/plugins/achievements/queries/achievements.graphql'
          s, n = re.subn(r'    gists\(.*?\n    }\n', '', p.read_text(), flags=re.S)
          assert n == 1
          p.write_text(s)
          p = root / 'source/plugins/achievements/list/users.mjs'
          s, n = re.subn(r'  //Gister\n.*?(?=  //Worker)', '', p.read_text(), flags=re.S)
          assert n == 1
          p.write_text(s)
          # Read the aggregate count without requesting the restricted stargazer list.
          p = root / 'source/plugins/achievements/queries/achievements.graphql'
          s = p.read_text()
          old = 'stargazers {\n          totalCount\n        }'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'stargazerCount'))
          p = root / 'source/plugins/achievements/list/users.mjs'
          s = p.read_text()
          assert s.count('?.stargazers?.totalCount') == 2
          p.write_text(s.replace('?.stargazers?.totalCount', '?.stargazerCount'))
          # Compute repository badges from the complete public owner inventory.
          p = root / 'source/plugins/achievements/queries/achievements.graphql'
          s = p.read_text()
          old = 'popular:repositories(first:1, orderBy:'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'popular:repositories(first:1, privacy: PUBLIC, affiliations: OWNER, isFork: false, orderBy:'))
          p = root / 'source/plugins/achievements/list/users.mjs'
          s = p.read_text()
          marker = '  const scores ='
          assert s.count(marker) == 1
          s = s.replace(marker, "  // Use a complete, public, owner-scoped inventory rather than token-visible GraphQL repositories.\n  const publicRepositories = []\n  for (let page = 1; ; page++) {\n    const {data: batch} = await rest.repos.listForUser({username: login, type: \"owner\", per_page: 100, page})\n    publicRepositories.push(...batch.filter(repo => !repo.private && repo.owner.login.toLowerCase() === login.toLowerCase()))\n    if (batch.length < 100) break\n  }\n  const originalRepositories = publicRepositories.filter(repo => !repo.fork)\n  const publicLanguages = new Set()\n  for (const repo of originalRepositories) {\n    const {data: languages} = await rest.repos.listLanguages({owner: repo.owner.login, repo: repo.name})\n    for (const name of Object.keys(languages)) publicLanguages.add(name)\n  }\n  user.repositories.totalCount = publicRepositories.length\n  user.forks.totalCount = publicRepositories.filter(repo => repo.fork).length\n  user.popular.nodes = [{stargazerCount: Math.max(0, ...originalRepositories.map(repo => repo.stargazers_count))}]\n" + marker)
          old = 'data.user.repositories.nodes.map(({forkCount}) => forkCount)'
          assert s.count(old) == 2
          s = s.replace(old, 'originalRepositories.map(repo => repo.forks_count)')
          old = 'new Set(data.user.repositories.nodes.flatMap(repository => repository.languages.edges.map(({node: {name}}) => name))).size'
          assert s.count(old) == 1
          s = s.replace(old, 'publicLanguages.size')
          s = s.replace('Published ${value} public repositor', 'Owns ${value} public repositor')
          s = s.replace('Using ${value} different programming language${imports.s(value)}', 'Detected ${value} languages across original public repositories')
          s = s.replace('Maintaining a repository with ${value} star', 'Most-starred original public repository has ${value} star')
          p.write_text(s)
          # Present four factual statistics without proficiency titles or rankings.
          p = root / 'source/plugins/achievements/index.mjs'
          s = p.read_text()
          old = "        prefix: ({S: \"Master\", A: \"Super\", B: \"Great\"}[achievement.rank] ?? \"\"),\n        title,"
          assert s.count(old) == 1
          s = s.replace(old, "        prefix: \"\",\n        title: ({Developer: \"Public repos\", Contributor: \"PRs opened\", Influencer: \"Followers\", Member: \"Account age (years)\"}[title] ?? title),")
          old = '        ...achievement,'
          assert s.count(old) == 1
          s = s.replace(old, '        ...achievement,\n        leaderboard: null,')
          p.write_text(s)
          p = root / 'source/templates/classic/partials/achievements.ejs'
          s = p.read_text()
          assert s.count('      Achievements\n') == 1
          p.write_text(s.replace('      Achievements\n', '      Profile facts\n'))
          # Reuse the official image and dependencies with only patched source mounted.
          p = root / 'action.yml'
          s = re.sub(r'(?m)^        METRICS_SOURCE=.*$', '        METRICS_SOURCE=lowlighter', p.read_text())
          s = s.replace('docker run --init --rm ', 'docker run --init --rm --volume "$METRICS_ACTION_PATH/source:/metrics/source:ro" ')
          p.write_text(s)

      # ------------------------------------------------------------------ #
      # The 3D isometric contribution calendar (the one from the inspo)
      # ------------------------------------------------------------------ #
      - name: Isometric contribution calendar
        uses: ./.metrics-action
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics.isocalendar.svg
          base: ""
          plugins_errors_fatal: yes
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ------------------------------------------------------------------ #
      # Coding habits: commits per hour of day, per weekday, language activity
      # ------------------------------------------------------------------ #
      - name: Coding habits
        uses: ./.metrics-action
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics.habits.svg
          base: ""
          plugins_errors_fatal: yes
          config_timezone: Asia/Kolkata
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

      # ------------------------------------------------------------------ #
      # Language breakdown (bytes-weighted, recent-activity weighted)
      # ------------------------------------------------------------------ #
      - name: Languages
        uses: ./.metrics-action
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics.languages.svg
          base: ""
          plugins_errors_fatal: yes
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: no
          plugin_languages_sections: most-used

      # ------------------------------------------------------------------ #
      # Achievement badges - the self-hosted replacement for
      # github-profile-trophy, whose public instance returns 402 (out of quota)
      # ------------------------------------------------------------------ #
      - name: Achievements
        uses: ./.metrics-action
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics.achievements.svg
          base: ""
          plugins_errors_fatal: yes
          config_timezone: Asia/Kolkata
          retries_delay: 30
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: no
          plugin_achievements_only: developer, contributor, influencer, member
          plugin_achievements_display: compact
          plugin_achievements_limit: 0
